name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE*', '.gitignore' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE*', '.gitignore' ]
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale PR runs, but let every push to main finish so each commit gets a full build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30

    defaults:
      run:
        working-directory: macos

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Native libraries rarely change; reuse the last build unless their sources did.
      - name: Restore native libraries
        id: native-cache
        uses: actions/cache@v6
        with:
          path: native/build/macos
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/CMakeLists.txt', 'native/src/**', 'native/include/**', 'native/tests/**', 'native/exports-*', 'native/scripts/build-macos.sh') }}
          restore-keys: native-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ../native/scripts/build-macos.sh

      - name: Test
        run: swift test --configuration release

      - name: Build app
        run: |
          xcodebuild \
            -project PakScape.xcodeproj \
            -scheme PakScape \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package disk image
        run: |
          APP_PATH="build/Build/Products/Release/PakScape.app"
          DMG_NAME="PakScape.dmg"
          STAGING_DIR="dmg_staging"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          rm -rf "$STAGING_DIR"
          mkdir "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/PakScape.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create "$DMG_NAME" \
            -volname "PakScape" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: PakScape-macOS
          path: macos/PakScape.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: windows

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache@v6
        with:
          path: native/build/windows
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/CMakeLists.txt', 'native/src/**', 'native/include/**', 'native/tests/**', 'native/exports-*', 'native/scripts/build-windows.ps1') }}
          restore-keys: native-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ../native/scripts/build-windows.ps1

      - name: Restore packages
        run: dotnet restore PakStudio.sln

      - name: Build app
        run: dotnet build PakStudio.sln --configuration Release --no-restore --maxcpucount:1

      - name: Test
        run: |
          $nativeDirectory = (Resolve-Path ../native/build/windows/Release).Path
          $env:PATH = "$nativeDirectory;$env:PATH"
          dotnet run --project PakStudio.Tests/PakStudio.Tests.csproj --configuration Release --no-build

      # One self-contained PakScape.exe; upload-artifact zips it, so the download is just the exe.
      - name: Publish single-file exe
        run: dotnet publish PakStudio.App/PakStudio.App.csproj -p:PublishProfile=win-x64

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: PakScape-Windows
          path: windows/artifacts/publish/win-x64/PakScape.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Ubuntu ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: ubuntu-24.04
            runtime: linux-x64
            architecture: amd64
          - label: Arm64
            runner: ubuntu-24.04-arm
            runtime: linux-arm64
            architecture: arm64

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache@v6
        with:
          path: native/build/linux
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/CMakeLists.txt', 'native/src/**', 'native/include/**', 'native/tests/**', 'native/exports-*', 'native/scripts/build-linux.sh') }}
          restore-keys: native-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends libgl-dev

      - name: Build native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: native/scripts/build-linux.sh

      - name: Restore packages
        run: dotnet restore linux/PakScape.Linux.slnx

      - name: Build app
        run: dotnet build linux/PakScape.Linux.slnx --configuration Release --no-restore --maxcpucount:1

      - name: Test
        run: |
          dotnet run --project windows/PakStudio.Tests/PakStudio.Tests.csproj --configuration Release --no-build
          dotnet run --project linux/PakScape.Linux.Tests/PakScape.Linux.Tests.csproj --configuration Release --no-build

      - name: Package
        run: |
          linux/packaging/build-deb.sh 1.0.2 ${{ matrix.runtime }}
          dpkg-deb --info linux/artifacts/pakscape_1.0.2_${{ matrix.architecture }}.deb

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: PakScape-Ubuntu-${{ matrix.architecture }}
          path: |
            linux/artifacts/pakscape_1.0.2_${{ matrix.architecture }}.deb
            linux/artifacts/pakscape_1.0.2_${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 14
